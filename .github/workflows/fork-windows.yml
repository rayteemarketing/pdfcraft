name: Fork Windows build

# This fork's own Windows build, on GitHub's standard (free for public repos) runner: lint and test
# the app and UI crates, then package an unsigned x64 MSI and portable zip with
# packaging/windows/package.ps1. The upstream release workflow needs ArtCraft's signing secrets.
#
# Download the installer from the run's artifacts. Windows SmartScreen warns about an unsigned
# installer: More info, then Run anyway.

on:
  workflow_dispatch:
  push:
    branches: [fork/montserrat-zoom-combine]

permissions:
  contents: read

concurrency:
  group: fork-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (test and package)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      PDFCRAFT_REQUIRE_WINRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (app, UI, engine, CLI and automation)
        run: cargo clippy -p pdfcraft -p pdfcraft-ui-egui -p pdfcraft-engine -p pdfcraft-cli -p pdfcraft-automation --all-targets -- -D warnings
      - name: Test (app, UI, engine, CLI and automation)
        run: cargo test -p pdfcraft -p pdfcraft-ui-egui -p pdfcraft-engine -p pdfcraft-cli -p pdfcraft-automation
      - name: Assets (licences and attribution)
        run: cargo xtask assets
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Package (unsigned)
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfcraft-windows-x64
          path: |
            dist/release/*.msi
            dist/release/*.zip
          if-no-files-found: error
